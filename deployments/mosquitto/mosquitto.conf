# Trial-stack broker (wave 4). TLS only, every client authenticated and bound to its own identity.
# Secrets are generated by deployments/scripts/dev-secrets.sh and mounted read-only, file by file.

allow_anonymous false
password_file /mosquitto/config/secrets/passwd
acl_file /mosquitto/config/acl

# QoS 1 queues and persistent sessions (24 h) must survive a broker restart.
persistence true
persistence_location /mosquitto/data/

# Messages queued for one offline client (e.g. the Cloud). Must exceed 2 x (number of Edges x
# Edge:Mqtt:MaxUnacknowledged); the bytes cap protects the broker's memory and disk. When either is reached the
# broker drops messages for that client: that only delays data, because each Edge keeps a sample until the
# Cloud confirms it (TelemetryAck) and sends it again.
max_queued_messages 20000
max_queued_bytes 134217728

# Matches the clients' 16 KiB limit; larger packets are a protocol error.
max_packet_size 16384

# The only listener: no plain-text port. Listener options must follow this line: placed above it they
# configure an implicit default listener, which Mosquitto then opens on plain-text port 1883.
listener 8883
protocol mqtt
# The client id is forced to the username, so one identity can never take over another's session.
use_username_as_clientid true
cafile /mosquitto/config/secrets/ca.pem
certfile /mosquitto/config/secrets/server.pem
keyfile /mosquitto/config/secrets/server.key
require_certificate false

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
